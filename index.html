<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padel Match Finder</title>
    <style>
        :root {
            --bg: #f0f2f5;
            --text: #1a1a2e;
            --card-bg: #fff;
            --card-shadow: rgba(0, 0, 0, .08);
            --card-shadow-hover: rgba(0, 0, 0, .12);
            --border: #e0e0e0;
            --border-light: #e2e8f0;
            --muted: #64748b;
            --muted-light: #94a3b8;
            --tag-bg: #f1f5f9;
            --tag-text: #475569;
            --player-bg: #f8fafc;
            --player-empty-border: #c8d6e5;
            --btn-border: #d0d0d0;
            --btn-text: #333;
            --btn-hover: #f0f0f0;
            --filter-hover: #f1f5f9;
            --track-bg: #e2e8f0;
            --accent: #3b82f6;
            --green: #22c55e;
            --error: #dc2626;
            --address: #777;
            --ctrl-h: 36px;
            --sticky-top-desktop: 56px;
            --sticky-top-mobile: 48px;
        }

        [data-theme="dark"] {
            --bg: #0f172a;
            --text: #e2e8f0;
            --card-bg: #1e293b;
            --card-shadow: rgba(0, 0, 0, .3);
            --card-shadow-hover: rgba(0, 0, 0, .5);
            --border: #334155;
            --border-light: #334155;
            --muted: #94a3b8;
            --muted-light: #64748b;
            --tag-bg: #334155;
            --tag-text: #cbd5e1;
            --player-bg: #0f172a;
            --player-empty-border: #475569;
            --btn-border: #475569;
            --btn-text: #e2e8f0;
            --btn-hover: #334155;
            --filter-hover: #334155;
            --track-bg: #475569;
            --accent: #3b82f6;
            --green: #22c55e;
            --error: #f87171;
            --address: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: background .2s, color .2s;
            overflow-x: clip;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px 16px;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        /* Toolbar */
        .toolbar-wrap {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            position: sticky;
            top: 0;
            z-index: 20;
            background: var(--bg);
            padding: 10px 0;
            margin-bottom: 8px;
        }

        .date-bar {
            display: contents;
        }

        .toolbar {
            display: contents;
        }

        .date-picker {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            background: var(--card-bg);
            padding: 0 6px;
            height: var(--ctrl-h);
            border-radius: 8px;
            box-shadow: 0 1px 3px var(--card-shadow);
            user-select: none;
        }

        .date-picker button {
            background: none;
            border: none;
            border-radius: 6px;
            width: 28px;
            height: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            color: var(--muted);
            transition: background .15s, color .15s;
        }

        .date-picker button:hover {
            background: var(--filter-hover);
            color: var(--text);
        }

        .date-display {
            font-weight: 600;
            font-size: 14px;
            min-width: 104px;
            text-align: center;
            cursor: pointer;
        }

        .date-display:hover {
            color: var(--accent);
        }

        .hidden-date-input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
            width: 0;
            height: 0;
        }

        /* Level Controls */
        .level-stack {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 5px;
            height: var(--ctrl-h);
            background: var(--card-bg);
            padding: 0 10px;
            border-radius: 8px;
            box-shadow: 0 1px 3px var(--card-shadow);
        }

        .level-control {
            display: flex;
            align-items: center;
            gap: 8px;
            height: 13px;
        }

        .level-control label {
            font-weight: 600;
            font-size: 11px;
            color: var(--muted);
            white-space: nowrap;
            width: 50px;
        }

        .level-control .value-display {
            font-size: 10px;
            font-weight: 700;
            color: var(--text);
            width: 58px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        .level-control>input[type=range] {
            width: 96px;
            -webkit-appearance: none;
            appearance: none;
            background: var(--track-bg);
            height: 4px;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        .level-control input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent);
            border: 2px solid #fff;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .3);
            cursor: grab;
        }

        .level-control input[type=range]::-webkit-slider-thumb:active {
            cursor: grabbing;
        }

        .level-control input[type=range]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent);
            border: 2px solid #fff;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .3);
            cursor: grab;
        }

        .level-control input[type=range]::-moz-range-thumb:active {
            cursor: grabbing;
        }

        .level-control input[type=range]::-moz-range-track {
            background: var(--track-bg);
            height: 4px;
            border-radius: 2px;
            border: none;
        }

        .dual-range {
            position: relative;
            width: 96px;
            height: 16px;
        }

        .dual-range input[type=range] {
            position: absolute;
            width: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            -webkit-appearance: none;
            appearance: none;
            background: none;
            height: 16px;
            margin: 0;
        }

        .dual-range input[type=range]::-webkit-slider-thumb {
            pointer-events: auto;
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent);
            border: 2px solid #fff;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .3);
            cursor: grab;
        }

        .dual-range input[type=range]::-webkit-slider-thumb:active {
            cursor: grabbing;
        }

        .dual-range input[type=range]::-moz-range-thumb {
            pointer-events: auto;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent);
            border: 2px solid #fff;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .3);
            cursor: grab;
        }

        .dual-range input[type=range]::-moz-range-thumb:active {
            cursor: grabbing;
        }

        .dual-range .track {
            position: absolute;
            top: 6px;
            height: 4px;
            background: var(--track-bg);
            width: 100%;
            border-radius: 2px;
        }

        .dual-range .track-fill {
            position: absolute;
            top: 6px;
            height: 4px;
            background: var(--accent);
            border-radius: 2px;
        }

        /* Club Section */
        .club-section {
            margin-bottom: 32px;
        }

        .club-header {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 14px;
            padding: 12px 16px;
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 1px 3px var(--card-shadow);
            display: flex;
            align-items: center;
            gap: 8px;
            position: sticky;
            top: var(--sticky-top-desktop);
            z-index: 10;
        }

        .club-header .address {
            font-weight: 400;
            font-size: 13px;
            color: var(--address);
            margin-left: auto;
        }

        /* Match Cards Grid */
        .matches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 14px;
        }

        .match-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 16px;
            box-shadow: 0 1px 4px var(--card-shadow);
            border-left: 4px solid var(--green);
            transition: box-shadow .15s;
        }

        .match-card:hover {
            box-shadow: 0 4px 12px var(--card-shadow-hover);
        }

        .match-card.full {
            border-left-color: var(--muted-light);
            opacity: .7;
        }

        .match-time {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: -.5px;
        }

        .match-price {
            color: var(--green);
            font-weight: 700;
            font-size: 15px;
        }

        .match-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .match-level {
            color: var(--muted);
            font-size: 13px;
        }

        .match-tags {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            margin-bottom: 10px;
            align-items: center;
        }

        .match-tags .spacer {
            margin-left: auto;
        }

        .tag-duration {
            background: var(--tag-bg);
            color: var(--muted);
            font-variant-numeric: tabular-nums;
        }

        .tag {
            display: inline-block;
            background: var(--tag-bg);
            color: var(--tag-text);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: capitalize;
        }

        .match-type {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .type-competitive {
            background: #fef3c7;
            color: #92400e;
        }

        .type-friendly {
            background: #dbeafe;
            color: #1e40af;
        }

        [data-theme="dark"] .type-competitive {
            background: #78350f;
            color: #fde68a;
        }

        [data-theme="dark"] .type-friendly {
            background: #1e3a5f;
            color: #93c5fd;
        }

        .players-list {
            display: flex;
            align-items: stretch;
            gap: 10px;
        }

        .team-group {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .team-avg {
            font-size: 10px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .3px;
        }

        .team-avg-you {
            color: var(--accent);
        }

        .team-conf {
            color: var(--muted-light);
            font-weight: 600;
        }

        .team-players {
            display: flex;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        .team-divider-v {
            width: 1px;
            background: var(--border-light);
            align-self: stretch;
            flex-shrink: 0;
        }

        .player-cell {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            min-width: 0;
            flex: 1;
            max-width: 72px;
        }

        .player-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }

        .player-avatar-placeholder {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--tag-bg);
            font-size: 18px;
            flex-shrink: 0;
        }

        .player-name {
            font-size: 12px;
            font-weight: 600;
            color: var(--text);
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .player-level-pill {
            font-size: 11px;
            font-weight: 700;
            color: var(--green);
            background: rgba(34, 197, 94, .15);
            padding: 1px 8px;
            border-radius: 10px;
            font-variant-numeric: tabular-nums;
        }

        .player-conf {
            font-size: 10px;
            font-weight: 600;
            color: var(--muted-light);
            font-variant-numeric: tabular-nums;
        }

        .player-cell.empty .player-name {
            color: var(--muted-light);
        }

        .player-cell.empty .player-avatar-placeholder {
            border: 1px dashed var(--player-empty-border);
            background: var(--card-bg);
            color: var(--green);
        }

        .player-cell.empty .player-level-pill {
            color: var(--muted-light);
            background: var(--tag-bg);
        }

        .spots-summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            font-size: 13px;
            color: var(--muted);
        }

        .spots-summary .avail {
            color: var(--green);
            font-weight: 700;
        }

        .match-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            font-weight: 600;
            color: var(--accent);
            text-decoration: none;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid var(--accent);
            transition: background .15s, color .15s;
        }

        .match-link:hover {
            background: var(--accent);
            color: #fff;
        }

        /* States */
        .loading,
        .error-msg,
        .no-matches {
            text-align: center;
            padding: 36px 16px;
            border-radius: 10px;
            background: var(--card-bg);
            box-shadow: 0 1px 3px var(--card-shadow);
        }

        .loading {
            color: var(--muted);
        }

        .loading::before {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--border-light);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin .6s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .error-msg {
            color: var(--error);
        }

        .error-msg .hint {
            color: var(--muted);
            font-size: 13px;
            margin-top: 8px;
        }

        .no-matches {
            color: var(--muted-light);
            font-style: italic;
        }

        /* Segmented filter controls (time / duration / gender) */
        .seg {
            display: inline-flex;
            align-items: stretch;
            height: var(--ctrl-h);
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 1px 3px var(--card-shadow);
            overflow: hidden;
        }

        .seg button {
            border: none;
            background: none;
            padding: 0 13px;
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            cursor: pointer;
            transition: background .15s, color .15s;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .seg button+button {
            border-left: 1px solid var(--border-light);
        }

        .seg button:hover {
            background: var(--filter-hover);
        }

        .seg button.active {
            background: var(--accent);
            color: #fff;
        }

        /* Compact, edge-to-edge toolbar controls on small screens */
        @media (max-width: 640px) {
            .toolbar-wrap {
                display: contents;
            }

            .date-bar {
                display: block;
                position: sticky;
                top: 0;
                z-index: 20;
                background: var(--bg);
                padding: 6px 0;
            }

            .toolbar {
                display: flex;
                flex-direction: column;
                gap: 6px;
                position: static;
                background: none;
                padding: 0;
                margin-top: 2px;
                margin-bottom: 8px;
            }

            .date-picker,
            .level-stack,
            .seg {
                width: 100%;
            }

            .seg {
                display: flex;
            }

            .seg button {
                flex: 1;
                min-width: 0;
            }

            .date-display {
                flex: 1;
            }

            .level-control>input[type=range],
            .dual-range {
                flex: 1;
                width: auto;
            }

            .dual-range input[type=range] {
                width: 100%;
            }

            .club-header {
                top: var(--sticky-top-mobile);
            }
        }

        /* Title Row + Hamburger Menu */
        .title-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .title-row h1 {
            margin: 0;
            flex: 1;
            min-width: 0;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }

        .user-avatar-wrap {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--tag-bg);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .user-avatar-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-info {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .user-name {
            font-size: 18px;
            font-weight: 700;
            line-height: 1.2;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .user-level {
            font-size: 13px;
            font-weight: 600;
            color: var(--accent);
        }

        .user-conf {
            color: var(--muted-light);
            font-weight: 600;
        }

        .menu-wrap {
            position: relative;
            flex-shrink: 0;
        }

        .hamburger-btn {
            background: var(--card-bg);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            box-shadow: 0 1px 3px var(--card-shadow);
            cursor: pointer;
            font-size: 18px;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .15s;
        }

        .hamburger-btn:hover {
            background: var(--filter-hover);
        }

        .menu-dropdown {
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            min-width: 168px;
            background: var(--card-bg);
            border-radius: 10px;
            box-shadow: 0 6px 20px var(--card-shadow-hover);
            border: 1px solid var(--border-light);
            padding: 6px;
            display: none;
            flex-direction: column;
            gap: 2px;
            z-index: 600;
        }

        .menu-dropdown.open {
            display: flex;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            background: none;
            border: none;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            cursor: pointer;
            text-align: left;
            white-space: nowrap;
            transition: background .15s, color .15s;
        }

        .menu-item:hover {
            background: var(--filter-hover);
        }

        .menu-item.danger {
            color: var(--error);
        }

        .menu-item.danger:hover {
            background: var(--error);
            color: #fff;
        }

        /* Login Screen */
        .login-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 40%, #1e293b 100%);
            animation: loginBgShift 12s ease-in-out infinite alternate;
        }

        @keyframes loginBgShift {
            0% {
                background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 40%, #1e293b 100%);
            }

            50% {
                background: linear-gradient(135deg, #0f172a 0%, #1a2744 50%, #162032 100%);
            }

            100% {
                background: linear-gradient(135deg, #0c1322 0%, #1e3a5f 60%, #1e293b 100%);
            }
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            margin: 0 16px;
            padding: 40px 32px;
            border-radius: 16px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.04);
            animation: cardFadeIn 0.5s ease-out;
        }

        @keyframes cardFadeIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .login-card h2 {
            color: #e2e8f0;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 6px;
            text-align: center;
        }

        .login-card .login-subtitle {
            color: #94a3b8;
            font-size: 14px;
            text-align: center;
            margin-bottom: 28px;
        }

        .login-card .login-logo {
            text-align: center;
            font-size: 36px;
            margin-bottom: 16px;
        }

        .login-field {
            margin-bottom: 18px;
        }

        .login-field label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        .login-field input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(15, 23, 42, 0.6);
            color: #e2e8f0;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .login-field input::placeholder {
            color: #475569;
        }

        .login-field input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            margin-top: 6px;
        }

        .login-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.35);
        }

        .login-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .login-btn .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);

            border-radius: 50%;

        .login-error {
            background: rgba(220, 38, 38, 0.12);

        }

        @keyframes shakeX {

            0%,
            100% {
                transform: translateX(0);

            20% {
                transform: translateX(-6px);
            }

            40% {
                transform: translateX(6px);
            }

            60% {

            }

        .login-error.visible {
            display: block;
        }

        .login-overlay.hidden {
            display: none;
        }

        .app-content.hidden {

        /* Level progression modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 1100;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, .5);
            padding: 16px;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-card {
            background: var(--card-bg);
            border-radius: 14px;
            width: 100%;
            max-width: 680px;
            box-shadow: 0 24px 48px var(--card-shadow-hover);
            border: 1px solid var(--border-light);
            overflow: hidden;
            animation: cardFadeIn .25s ease-out;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 18px;
            font-size: 16px;
            font-weight: 700;
            border-bottom: 1px solid var(--border-light);
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 22px;
            line-height: 1;
            color: var(--muted);
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .15s, color .15s;
        }

        .modal-close:hover {
            background: var(--filter-hover);
            color: var(--text);
        }

        .modal-body {
            padding: 18px;
        }

        .level-chart {
            width: 100%;
            height: auto;
            display: block;
        }

        .chart-grid {
            stroke: var(--border-light);
            stroke-width: 1;
        }

        .chart-area {
            fill: rgba(59, 130, 246, .12);
            stroke: none;
        }

        .chart-line {
            fill: none;
            stroke: var(--accent);
            stroke-width: 2.5;
            stroke-linejoin: round;
            stroke-linecap: round;
        }

        .chart-dot {
            fill: var(--accent);
            stroke: var(--card-bg);
            stroke-width: 1.5;
        }

        .chart-ylabel {
            fill: var(--muted);
            font-size: 10px;
            text-anchor: end;
            font-weight: 600;
        }

        .chart-xlabel {
            fill: var(--muted);
            font-size: 10px;
            text-anchor: middle;
            font-weight: 600;
        }

        .chart-empty {
            text-align: center;
            color: var(--muted);
            padding: 40px 0;
        }

        .chart-caption {
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 10px;
            text-align: center;
        }

        .chart-wrap {
            position: relative;
        }

        .chart-dot {
            transition: r .1s;
        }

        .chart-hit {
            cursor: pointer;
        }

        .chart-hit:hover+.chart-dot,
        .chart-dot.active {
            r: 5;
        }

        .chart-tooltip {
            position: absolute;
            pointer-events: none;
            background: var(--text);
            color: var(--card-bg);
            padding: 5px 9px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
            opacity: 0;
            transform: translateY(4px);
            transition: opacity .12s, transform .12s;
            z-index: 5;
            display: flex;
            flex-direction: column;
            gap: 1px;
            line-height: 1.35;
            box-shadow: 0 4px 12px var(--card-shadow-hover);
        }

        .chart-tooltip.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .chart-tooltip .tt-date {
            font-weight: 500;
            opacity: .8;
        }

        /* Pull-to-refresh indicator */
        .pull-indicator {
            position: fixed;
            top: 8px;
            left: 50%;
            width: 38px;
            height: 38px;
            margin-left: -19px;
            border-radius: 50%;
            background: var(--card-bg);
            box-shadow: 0 2px 8px var(--card-shadow);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            font-size: 20px;
            opacity: 0;
            transform: translateY(-60px);
            pointer-events: none;
            z-index: 500;
        }

        .pull-indicator.refreshing .pull-icon {
            animation: spin .6s linear infinite;
        }
    </style>
</head>

<body>

            <form id="loginForm" onsubmit="handleLogin(event)">

    <script>
        const API_BASE = 'https://corsproxy.io/?url=https://api.app.playtomic.io';

        // ========================
        // AUTH MODULE
        // ========================
        const AUTH_STORAGE_KEY = 'playtomic_auth';
        const LEVELS_STORAGE_KEY = 'playtomic_levels';
        const USER_PROFILE_STORAGE_KEY = 'playtomic_user_profile';
        const AUTH_LOGIN_URL = API_BASE + '/v3/auth/login';
        const AUTH_REFRESH_URL = API_BASE + '/v3/auth/token';
        const LEVELS_URL = API_BASE + '/v1/levels?user_id=me&with_history=true';
        const USER_PROFILE_URL = API_BASE + '/v2/users/me';
        const TOKEN_REFRESH_MARGIN_MS = 5 * 60 * 1000; // refresh 5 min before expiry
        let refreshTimerHandle = null;
        let refreshPromise = null; // in-flight singleton refresh (dedupes concurrent refreshes)

        function getStoredAuth() {
            try {
                const raw = localStorage.getItem(AUTH_STORAGE_KEY);
                return raw ? JSON.parse(raw) : null;
            } catch (_) {
                return null;
            }
        }

        function storeAuth(data) {
            localStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify({
                access_token: data.access_token,
                access_token_expiration: data.access_token_expiration,
                refresh_token: data.refresh_token,
                refresh_token_expiration: data.refresh_token_expiration,
                user_id: data.user_id
            }));
        }

        function clearAuth() {
            localStorage.removeItem(AUTH_STORAGE_KEY);
            localStorage.removeItem(LEVELS_STORAGE_KEY);
            localStorage.removeItem(USER_PROFILE_STORAGE_KEY);
            if (refreshTimerHandle) {
                clearTimeout(refreshTimerHandle);
                refreshTimerHandle = null;
            }
        }

        function isAccessTokenValid(auth) {
            if (!auth || !auth.access_token || !auth.access_token_expiration) return false;
            const exp = new Date(auth.access_token_expiration + 'Z').getTime();
            return Date.now() < exp;
        }

        function isRefreshTokenValid(auth) {
            if (!auth || !auth.refresh_token || !auth.refresh_token_expiration) return false;
            const exp = new Date(auth.refresh_token_expiration + 'Z').getTime();
            return Date.now() < exp;
        }

        // Performs the actual refresh network call. Never call directly — go through
        // refreshAccessToken() so concurrent callers share a single request.
        async function performTokenRefresh() {
            const auth = getStoredAuth();
            if (!auth || !isRefreshTokenValid(auth)) {
                clearAuth();
                showLoginScreen();
                return false;
            }
            try {
                const res = await fetch(AUTH_REFRESH_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ refresh_token: auth.refresh_token, requested_user_roles: ['ROLE_CUSTOMER'] })
                });
                if (!res.ok) {
                    console.warn('Token refresh failed: HTTP ' + res.status);
                    clearAuth();
                    showLoginScreen();
                    return false;
                }
                const data = await res.json();
                storeAuth(data);
                scheduleTokenRefresh();
                console.log('Access token refreshed successfully');
                return true;
            } catch (e) {
                console.warn('Token refresh error:', e);
                clearAuth();
                showLoginScreen();
                return false;
            }
        }

        // Singleton refresh: because the refresh token is single-use, concurrent
        // callers (parallel requests, 401 retries, the scheduled timer) must all
        // await the SAME in-flight refresh instead of each spending the token.
        function refreshAccessToken() {
            if (refreshPromise) return refreshPromise;
            refreshPromise = performTokenRefresh().finally(() => {
                refreshPromise = null;
            });
            return refreshPromise;
        }

        function scheduleTokenRefresh() {
            if (refreshTimerHandle) {
                clearTimeout(refreshTimerHandle);
                refreshTimerHandle = null;
            }
            const auth = getStoredAuth();
            if (!auth || !auth.access_token_expiration) return;

            const expMs = new Date(auth.access_token_expiration + 'Z').getTime();
            const delay = expMs - Date.now() - TOKEN_REFRESH_MARGIN_MS;

            // Only schedule a FUTURE refresh. If the token is already within the margin
            // (delay <= 0), do NOT refresh now — let it happen lazily on the next request
            // (via ensureValidToken) or when a request returns 401.
            if (delay > 0) {
                refreshTimerHandle = setTimeout(() => {
                    refreshAccessToken();
                }, delay);
                console.log('Token refresh scheduled in ' + Math.round(delay / 1000) + 's');
            }
        }

        async function ensureValidToken() {
            const auth = getStoredAuth();
            if (!auth) return false;
            if (isAccessTokenValid(auth)) return true;
            if (isRefreshTokenValid(auth)) return await refreshAccessToken();
            clearAuth();
            showLoginScreen();
            return false;
        }

        // ========================
        // USER LEVEL MODULE
        // ========================
        function getUserLevel() {
            try {
                const raw = localStorage.getItem(LEVELS_STORAGE_KEY);
                if (!raw) return 1.50;
                const levels = JSON.parse(raw);
                if (Array.isArray(levels) && levels.length > 0 && levels[0].level_value != null) {
                    return levels[0].level_value;
                }
            } catch (_) { }
            return 1.50;
        }

        function getUserLevelConfidence() {
            try {
                const raw = localStorage.getItem(LEVELS_STORAGE_KEY);
                if (!raw) return null;
                const levels = JSON.parse(raw);
                if (Array.isArray(levels) && levels.length > 0 && levels[0].level_confidence != null) {
                    return levels[0].level_confidence;
                }
            } catch (_) { }
            return null;
        }

        async function fetchUserLevel() {
            try {
                await ensureValidToken();
                const auth = getStoredAuth();
                if (!auth || !auth.access_token) return;
                const res = await fetch(LEVELS_URL, {
                    headers: { 'Authorization': 'Bearer ' + auth.access_token }
                });
                if (!res.ok) {
                    console.warn('Failed to fetch user level: HTTP ' + res.status);
                    return;
                }
                const data = await res.json();
                localStorage.setItem(LEVELS_STORAGE_KEY, JSON.stringify(data));
                applyUserLevel();
                updateUserHeader();
            } catch (e) {
                console.warn('Error fetching user level:', e);
            }
        }

        function applyUserLevel() {
            const level = getUserLevel();
            const params = new URLSearchParams(location.search);
            // Only apply if the URL doesn't already have a user-set level
            if (!params.has('level')) {
                document.getElementById('myLevel').value = level;
                document.getElementById('myLevelDisplay').textContent = level.toFixed(2);
                const newMax = Math.min(level + 3, 7);
                document.getElementById('maxLevel').value = newMax;
                document.getElementById('maxLevelDisplay').textContent = newMax.toFixed(2);
                updateTrackFill();
            }
        }

        // ========================
        // USER PROFILE MODULE
        // ========================
        function getUserGender() {
            try {
                const raw = localStorage.getItem(USER_PROFILE_STORAGE_KEY);
                if (!raw) return null;
                const profile = JSON.parse(raw);
                if (profile && profile.gender) return profile.gender;
            } catch (_) { }
            return null;
        }

        function getDefaultGenderFilters() {
            const gender = getUserGender();
            if (gender === 'MALE') return new Set(['male', 'mixed']);
            if (gender === 'FEMALE') return new Set(['female', 'mixed']);
            return new Set(['male', 'female', 'mixed']);
        }

        async function fetchUserProfile() {
            try {
                await ensureValidToken();
                const auth = getStoredAuth();
                if (!auth || !auth.access_token) return;
                const res = await fetch(USER_PROFILE_URL, {
                    headers: { 'Authorization': 'Bearer ' + auth.access_token }
                });
                if (!res.ok) {
                    console.warn('Failed to fetch user profile: HTTP ' + res.status);
                    return;
                }
                const data = await res.json();
                localStorage.setItem(USER_PROFILE_STORAGE_KEY, JSON.stringify(data));
                applyUserGender();
                updateUserHeader();
            } catch (e) {
                console.warn('Error fetching user profile:', e);
            }
        }

        function applyUserGender() {
            const params = new URLSearchParams(location.search);
            // Only apply if the URL doesn't already have a user-set gender
            if (!params.has('gender')) {
                activeGenderFilters = getDefaultGenderFilters();
                updateGenderFilterUI();
            }
        }

        function updateUserHeader() {
            let profile = null;
            try {
                const raw = localStorage.getItem(USER_PROFILE_STORAGE_KEY);
                if (raw) profile = JSON.parse(raw);
            } catch (_) { }
            const name = (profile && (profile.full_name || profile.name)) || 'Player';
            const picture = profile && profile.picture;
            const level = getUserLevel();
            const avatarEl = document.getElementById('userAvatar');
            const nameEl = document.getElementById('userName');
            const levelEl = document.getElementById('userLevel');
            if (nameEl) nameEl.textContent = name;
            if (levelEl) {
                const conf = getUserLevelConfidence();
                levelEl.innerHTML = 'Level ' + level.toFixed(2)
                    + (conf != null ? ' <span class="user-conf">\u00b7 ' + Math.round(conf * 100) + '%</span>' : '');
            }
            if (avatarEl) {
                avatarEl.innerHTML = picture
                    ? '<img src="' + esc(picture) + '" alt="">'
                    : '\u{1F464}';
            }
        }

        // ========================
        // LEVEL PROGRESSION CHART
        // ========================
        function getLevelHistory() {
            try {
                const raw = localStorage.getItem(LEVELS_STORAGE_KEY);
                if (!raw) return [];
                const levels = JSON.parse(raw);
                if (Array.isArray(levels) && levels.length > 0 && Array.isArray(levels[0].history)) {
                    return levels[0].history
                        .filter(h => h.level_value != null && h.date)
                        .map(h => ({ value: h.level_value, date: new Date(h.date + 'Z'), type: h.object_type }))
                        .sort((a, b) => a.date - b.date);
                }
            } catch (_) { }
            return [];
        }

        function renderLevelChart(points) {
            if (!points.length) {
                return '<div class="chart-empty">No level history available yet.</div>';
            }

            const W = 640, H = 320, padL = 40, padR = 18, padT = 18, padB = 42;
            const plotW = W - padL - padR;
            const plotH = H - padT - padB;
            const n = points.length;

            const values = points.map(p => p.value);
            let minV = Math.min(...values), maxV = Math.max(...values);
            const vPad = Math.max(0.2, (maxV - minV) * 0.15);
            minV = Math.max(0, minV - vPad);
            maxV = maxV + vPad;

            // Evenly space points along the X axis (aligned by index, not by elapsed time)
            const xOf = i => padL + (n === 1 ? plotW / 2 : (i / (n - 1)) * plotW);
            const yOf = v => padT + (maxV === minV ? plotH / 2 : (1 - (v - minV) / (maxV - minV)) * plotH);

            const yTicks = 5;
            let grid = '';
            for (let i = 0; i <= yTicks; i++) {
                const v = minV + (maxV - minV) * (i / yTicks);
                const y = yOf(v);
                grid += '<line class="chart-grid" x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + y.toFixed(1) + '"></line>';
                grid += '<text class="chart-ylabel" x="' + (padL - 6) + '" y="' + (y + 3).toFixed(1) + '">' + v.toFixed(1) + '</text>';
            }

            let xlabels = '';
            const labelCount = Math.min(n, 6);
            const seenIdx = new Set();
            for (let i = 0; i < labelCount; i++) {
                const idx = labelCount <= 1 ? 0 : Math.round(i * (n - 1) / (labelCount - 1));
                if (seenIdx.has(idx)) continue;
                seenIdx.add(idx);
                const p = points[idx];
                const x = xOf(idx);
                const label = p.date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
                xlabels += '<text class="chart-xlabel" x="' + x.toFixed(1) + '" y="' + (H - padB + 18) + '">' + esc(label) + '</text>';
            }

            const linePts = points.map((p, i) => xOf(i).toFixed(1) + ',' + yOf(p.value).toFixed(1));
            const linePath = 'M' + linePts.join(' L');
            const baseY = yOf(minV).toFixed(1);
            const areaPath = 'M' + xOf(0).toFixed(1) + ',' + baseY
                + ' L' + linePts.join(' L')
                + ' L' + xOf(n - 1).toFixed(1) + ',' + baseY + ' Z';

            let dots = '', hits = '';
            points.forEach((p, i) => {
                const x = xOf(i), y = yOf(p.value);
                const dateLbl = p.date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric', timeZone: 'UTC' });
                dots += '<circle class="chart-dot" cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="3.5"></circle>';
                hits += '<circle class="chart-hit" cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="14" fill="transparent"'

        function attachChartInteractions() {
            const wrap = document.getElementById('chartWrap');
            const tip = document.getElementById('chartTooltip');
            if (!wrap || !tip) return;
            const show = (hit) => {
                const wrapRect = wrap.getBoundingClientRect();
                const r = hit.getBoundingClientRect();
                const cx = r.left + r.width / 2 - wrapRect.left;
                const cy = r.top + r.height / 2 - wrapRect.top;
                tip.innerHTML = '<span class="tt-value">Level ' + esc(hit.getAttribute('data-value')) + '</span>'
                    + '<span class="tt-date">' + esc(hit.getAttribute('data-date')) + '</span>';
                tip.classList.add('visible');
                const tipW = tip.offsetWidth, tipH = tip.offsetHeight;
                let left = cx - tipW / 2;
                left = Math.max(4, Math.min(left, wrap.clientWidth - tipW - 4));
                let top = cy - tipH - 12;
                if (top < 4) top = cy + 14;
                tip.style.left = left + 'px';
                tip.style.top = top + 'px';
            };
            const hide = () => tip.classList.remove('visible');
            wrap.querySelectorAll('.chart-hit').forEach(hit => {
                hit.addEventListener('mouseenter', () => show(hit));
                hit.addEventListener('mouseleave', hide);
                hit.addEventListener('click', (e) => { e.stopPropagation(); show(hit); });
            });
            wrap.addEventListener('click', (e) => {

            event.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const loginBtn = document.getElementById('loginBtn');
            const loginError = document.getElementById('loginError');

            loginError.classList.remove('visible');
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner"></span> Signing in\u2026';

            try {
                const res = await fetch(AUTH_LOGIN_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        requested_user_roles: ['ROLE_CUSTOMER'],
                        email: email,
                        password: password
                    })
                });

                if (!res.ok) {
                    const status = res.status;
                    let msg = 'Login failed';
                    if (status === 401 || status === 403) msg = 'Invalid email or password';
                    else if (status === 429) msg = 'Too many attempts. Please try again later.';
                    else msg = 'Login failed (HTTP ' + status + ')';
                    throw new Error(msg);
                }

                const data = await res.json();
                storeAuth(data);
                scheduleTokenRefresh();
                await Promise.all([fetchUserLevel(), fetchUserProfile()]);
                showAppScreen();
            } catch (e) {
                loginError.textContent = e.message;
                loginError.classList.add('visible');
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerHTML = 'Sign In';
            }

        const fetchCache = {};

        function getAuthHeaders() {
            const auth = getStoredAuth();
            if (auth && auth.access_token) {
                return { 'Authorization': 'Bearer ' + auth.access_token };
            }
            return {};
        }

        async function fetchUrl(url) {
            const cacheKey = new URL(url);
            cacheKey.searchParams.delete('to_created_at');
            const key = cacheKey.toString();
            if (fetchCache[key]) return fetchCache[key];

            // Ensure we have a valid token before making API calls
            await ensureValidToken();

            const res = await fetch(url, { headers: getAuthHeaders() });
            if (res.status === 401) {
                // Token may have been invalidated server-side, try refreshing
                const refreshed = await refreshAccessToken();
                if (refreshed) {
                    const res2 = await fetch(url, { headers: getAuthHeaders() });
                    if (!res2.ok) throw new Error('HTTP ' + res2.status);
                    const data = await res2.json();
                    fetchCache[key] = data;
                    return data;
                }
                throw new Error('Authentication expired. Please log in again.');
            }
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();
            fetchCache[key] = data;
            return data;
        }

        async function fetchAllMatches() {
            const [inLevel, outsideLevel] = await Promise.all([
                fetchUrl(buildUrl()),
                fetchUrl(buildUrl({
                    outside_max_level: document.getElementById('maxLevel').value,
                    outside_min_level: document.getElementById('minLevel').value,
                    show_outside_player_level_only: 'true'
                }))
            ]);
            // Deduplicate by match_id and sort by start_date ASC
            const seen = new Set();
            const all = [];
            for (const m of [...inLevel, ...outsideLevel]) {
                if (!seen.has(m.match_id)) {
                    seen.add(m.match_id);
                    all.push(m);
                }
            }
            all.sort((a, b) => a.start_date.localeCompare(b.start_date));
            return all;
        }

            const num = parseFloat(match[1]);
            const currency = match[2];
            const symbol = currency === 'EUR' ? '\u20AC' : currency;
            const formatted = num % 1 === 0 ? String(Math.round(num)) : num.toFixed(2).replace('.', ',');
            return formatted + ' ' + symbol;

            const genderEmoji = m.gender === 'MALE' ? ' ♂' : m.gender === 'FEMALE' ? ' ♀' : '';

            const matchType = m.competition_mode === 'COMPETITIVE' ? 'Competitive' : 'Friendly';
            const matchTypeClass = m.competition_mode === 'COMPETITIVE' ? 'type-competitive' : 'type-friendly';

            const duration = Math.round((new Date(m.end_date + 'Z') - new Date(m.start_date + 'Z')) / 60000);

            const tz = getTimezone(m);
            const priceStr = formatPrice(m.price);

            return '<div class="match-card' + (full ? ' full' : '') + '">'
                + '<div class="match-time"><span>' + utcToLocal(m.start_date, tz) + ' \u2013 ' + utcToLocal(m.end_date, tz) + '</span><span class="match-price">' + esc(priceStr) + '</span></div>'
                + '<div class="match-tags">' + tags + '<span class="spacer"></span><span class="tag tag-duration">' + duration + ' min</span></div>'
                + '<div class="match-meta">'
                + '<span class="match-level">' + esc(levelRange) + (resourceText ? ' &middot; ' + resourceText : '') + genderEmoji + '</span>'
                + '<span class="match-type ' + matchTypeClass + '">' + esc(matchType) + '</span>'
                + '</div>'
                + '<div class="players-list">' + playersHtml + '</div>'
                + '<div class="spots-summary">'
                + '<span>' + (spots.available > 0
                    ? '<span class="avail">' + spots.available + ' spot' + (spots.available > 1 ? 's' : '') + ' available</span> / ' + spots.total + ' total'
                    : 'Full') + '</span>'
                + '<a class="match-link" href="https://app.playtomic.io/matches/' + encodeURIComponent(m.match_id) + '" target="_blank" rel="noopener">Join \u2197</a>'
                + '</div>'
                + '</div>';
        }

        function renderClubSection(club, matches, error) {
            let body;
            if (error) {
                body = '<div class="error-msg">Failed to load matches: ' + esc(error)
                    + '<div class="hint">If blocked by CORS, try opening this page via a local server or using a browser extension.</div>'
                    + '</div>';
            } else if (matches.length === 0) {
                body = '<div class="no-matches">No matches found for this date</div>';
            } else {
                body = '<div class="matches-grid">' + matches.map(renderMatchCard).join('') + '</div>';
            }

            const addr = (matches.length > 0 && matches[0].tenant && matches[0].tenant.address)
                ? matches[0].tenant.address.street + ', ' + matches[0].tenant.address.city
                : '';

            return '<div class="club-section">'
                + '<div class="club-header">'
                + '<span>\u{1F4CD} ' + esc(club.name) + '</span>'
                + (addr ? '<span class="address">' + esc(addr) + '</span>' : '')
                + '</div>'
                + body
                + '</div>';
        }

        function filterMatchesByTime(matches) {
            return matches.filter(m => {
                const tz = getTimezone(m);
                const d = new Date(m.start_date + 'Z');
                const hour = parseInt(d.toLocaleTimeString('en-US', { timeZone: tz, hour: 'numeric', hour12: false }), 10);
                for (const name of activeTimeFilters) {
                    const r = TIME_RANGES[name];
                    if (hour >= r.start && hour < r.end) return true;
                }
                return false;
            });
        }

        function filterMatchesByDuration(matches) {
            return matches.filter(m => {
                const start = new Date(m.start_date + 'Z');
                const end = new Date(m.end_date + 'Z');
                const mins = Math.round((end - start) / 60000);
                return activeDurationFilters.has(String(mins));
            });
        }

        function filterMatchesByGender(matches) {
            return matches.filter(m => {
                if (m.gender === 'MALE') return activeGenderFilters.has('male');
                if (m.gender === 'FEMALE') return activeGenderFilters.has('female');
                return activeGenderFilters.has('mixed');
            });
        }

        let lastFetchedMatches = [];
        let lastFetchError = null;
        let usersData = {};

        async function fetchUsersData(matches) {
            const userIds = new Set();
            for (const m of matches) {
                for (const t of m.teams) {
                    for (const p of t.players) {
                        if (p.user_id && !usersData[p.user_id]) userIds.add(p.user_id);
                    }
                }
            }
            if (userIds.size === 0) return;
            try {
                const ids = Array.from(userIds).join(',');
                const data = await fetchUrl(API_BASE + '/v2/users?user_id=' + encodeURIComponent(ids));
                if (Array.isArray(data)) {
                    for (const u of data) {
                        if (u.user_id) usersData[u.user_id] = u;
                    }
                }
            } catch (e) {
                console.warn('Failed to fetch user data:', e);
            }
        }

        function displayMatches() {
            const content = document.getElementById('content');
            const filtered = filterMatchesByGender(filterMatchesByDuration(filterMatchesByTime(lastFetchedMatches)));
            const matchesByTenant = {};
            for (const m of filtered) {
                const tid = m.tenant ? m.tenant.tenant_id : 'unknown';
                if (!matchesByTenant[tid]) matchesByTenant[tid] = [];
                matchesByTenant[tid].push(m);
            }
            const results = CLUBS.map(club => ({
                club,
                matches: matchesByTenant[club.id] || [],
                error: lastFetchError
            }));
            content.innerHTML = results.map(r => renderClubSection(r.club, r.matches, r.error)).join('');
        }

        async function render() {
            document.getElementById('dateText').textContent = formatDisplayDate(currentDate);
            document.getElementById('dateInput').value = toISODate(currentDate);
            const content = document.getElementById('content');
            content.innerHTML = '<div class="loading">Loading matches\u2026</div>';

            let allMatches = [];
            let fetchError = null;
            try {
                allMatches = await fetchAllMatches();
                await fetchUsersData(allMatches);
            } catch (e) {
                fetchError = e.message;
            }

            lastFetchedMatches = allMatches;
            lastFetchError = fetchError;
            displayMatches();
        }

        // ========================
        // TOUCH GESTURES
        // ========================
        // Horizontal swipe changes the day; pull-down at top refreshes.
        const SWIPE_THRESHOLD = 60;   // px of horizontal travel to change date
        const PULL_THRESHOLD = 70;    // px of (damped) pull to trigger refresh
        const PULL_MAX = 90;          // cap on how far the indicator travels

        let gStartX = 0, gStartY = 0, gStartScroll = 0;
        let gAxis = null;             // null | 'horizontal' | 'vertical' | 'ignore'
        let gPulling = false;
        let gRefreshing = false;

        const pullIndicator = document.getElementById('pullIndicator');
        const pullIcon = pullIndicator.querySelector('.pull-icon');

        function setPull(dist) {
            pullIndicator.style.transition = 'none';
            pullIndicator.style.transform = 'translateY(' + (dist - 60) + 'px)';
            pullIndicator.style.opacity = Math.min(dist / PULL_THRESHOLD, 1);
            pullIcon.style.transform = 'rotate(' + Math.min(dist / PULL_THRESHOLD, 1) * 270 + 'deg)';
        }

        function resetPull() {
            pullIndicator.style.transition = 'transform .25s ease, opacity .25s ease';
            pullIndicator.style.transform = 'translateY(-60px)';
            pullIndicator.style.opacity = '0';
            pullIndicator.classList.remove('refreshing');
            pullIcon.style.transform = '';
        }

        async function triggerRefresh() {
            gRefreshing = true;
            pullIndicator.style.transition = 'transform .2s ease';
            pullIndicator.style.transform = 'translateY(0)';
            pullIndicator.style.opacity = '1';
            pullIndicator.classList.add('refreshing');
            // Bypass caches so we actually pull fresh data
            for (const k in fetchCache) delete fetchCache[k];
            usersData = {};
            try { await render(); } finally {
                gRefreshing = false;
                resetPull();
            }
        }

        function onTouchStart(e) {
            if (e.touches.length !== 1 || gRefreshing) { gAxis = 'ignore'; return; }
            const t = e.touches[0];
            // Ignore gestures that begin on interactive controls (sliders, buttons, links)
            const el = e.target;
            if (el && typeof el.closest === 'function' && el.closest('input, button, a, select, textarea')) {
                gAxis = 'ignore';
                return;
            }
            gStartX = t.clientX;
            gStartY = t.clientY;
            gStartScroll = window.scrollY || document.documentElement.scrollTop || 0;
            gAxis = null;
            gPulling = false;
        }

        function onTouchMove(e) {
            if (gAxis === 'ignore' || e.touches.length !== 1) return;
            const t = e.touches[0];
            const dx = t.clientX - gStartX;
            const dy = t.clientY - gStartY;
            if (gAxis === null) {
                if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
                    gAxis = Math.abs(dx) > Math.abs(dy) ? 'horizontal' : 'vertical';
                }
            }
            if (gAxis === 'vertical' && dy > 0 && gStartScroll <= 0) {
                gPulling = true;
                setPull(Math.min(dy * 0.5, PULL_MAX));
                if (e.cancelable) e.preventDefault(); // suppress native overscroll while pulling
            }
        }

        function onTouchEnd(e) {
            if (gAxis === 'ignore') { gAxis = null; return; }
            const t = e.changedTouches[0];
            const dx = t.clientX - gStartX;
            const dy = t.clientY - gStartY;
            if (gAxis === 'horizontal' && Math.abs(dx) >= SWIPE_THRESHOLD) {
                if (dx < 0) changeDate(1); else changeDate(-1);
            } else if (gPulling) {
                if (Math.min(dy * 0.5, PULL_MAX) >= PULL_THRESHOLD) triggerRefresh();
                else resetPull();
            }
            gAxis = null;
            gPulling = false;
        }

        document.addEventListener('touchstart', onTouchStart, { passive: true });
        document.addEventListener('touchmove', onTouchMove, { passive: false });
        document.addEventListener('touchend', onTouchEnd, { passive: true });
        document.addEventListener('touchcancel', () => { if (!gRefreshing) resetPull(); gAxis = null; gPulling = false; }, { passive: true });

        // Boot: check auth state and show appropriate screen
        initAuth();
    </script>
</body>

</html>
